      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

\u0026quot;annotationdefaults\u0026quot;:{\u0026quot;arrowcolor\u0026quot;:\u0026quot;#2a3f5f\u0026quot;,\u0026quot;arrowhead\u0026quot;:0,\u0026quot;arrowwidth\u0026quot;:1},\u0026quot;geo\u0026quot;:{\u0026quot;bgcolor\u0026quot;:\u0026quot;white\u0026quot;,\u0026quot;landcolor\u0026quot;:\u0026quot;#E5ECF6\u0026quot;,\u0026quot;subunitcolor\u0026quot;:\u0026quot;white\u0026quot;,\u0026quot;showland\u0026quot;:true,\u0026quot;showlakes\u0026quot;:true,\u0026quot;lakecolor\u0026quot;:\u0026quot;white\u0026quot;},\u0026quot;title\u0026quot;:{\u0026quot;x\u0026quot;:0.05}}},\u0026quot;xaxis\u0026quot;:{\u0026quot;anchor\u0026quot;:\u0026quot;y\u0026quot;,\u0026quot;domain\u0026quot;:[0.0,1.0],\u0026quot;title\u0026quot;:{\u0026quot;text\u0026quot;:\u0026quot;\u0026quot;}},\u0026quot;yaxis\u0026quot;:{\u0026quot;anchor\u0026quot;:\u0026quot;x\u0026quot;,\u0026quot;domain\u0026quot;:[0.0,1.0],\u0026quot;title\u0026quot;:{\u0026quot;text\u0026quot;:\u0026quot;Nombre de chunks\u0026quot;},\u0026quot;rangemode\u0026quot;:\u0026quot;tozero\u0026quot;},\u0026quot;legend\u0026quot;:{\u0026quot;tracegroupgap\u0026quot;:0},\u0026quot;title\u0026quot;:{\u0026quot;text\u0026quot;:\u0026quot;\u00c9valuation des chunks exacts\u0026quot;},\u0026quot;barmode\u0026quot;:\u0026quot;relative\u0026quot;,\u0026quot;showlegend\u0026quot;:false,\u0026quot;dragmode\u0026quot;:\u0026quot;zoom\u0026quot;}}' data-config='{}'\u003E\u003C/marimo-plotly\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"metriques-de-performance\"\u003EM\u00e9triques de performance\u003C/h3\u003E\u003C/span\u003E\u003Cmarimo-ui-element object-id='aLJB-1' random-id='166b10b5-4647-9ab4-3d1c-f81619c9b046'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;_marimo_row_id\u0026#92;\u0026quot;:0,\u0026#92;\u0026quot;M\u0026#92;\u0026#92;u00e9trique\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Pr\u0026#92;\u0026#92;u00e9cision\u0 3E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003EAccuracy\u003C/td\u003E\n\u003Ctd\u003E91,14 %\u003C/td\u003E\n\u003Ctd\u003E89,67 %\u003C/td\u003E\n\u003Ctd\u003ENon calcul\u00e9e\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003EPr\u00e9cision\u003C/td\u003E\n\u003Ctd\u003E90,73 %\u003C/td\u003E\n\u003Ctd\u003E88,50 %\u003C/td\u003E\n\u003Ctd\u003E74,90 %\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003ERappel\u003C/td\u003E\n\u003Ctd\u003E90,06 %\u003C/td\u003E\n\u003Ctd\u003E89,24 %\u003C/td\u003E\n\u003Ctd\u003E77,10 %\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003EF-mesure\u003C/td\u003E\n\u003Ctd\u003E90,34 %\u003C/td\u003E\n\u003Ctd\u003E88,66 %\u003C/td\u003E\n\u003Ctd\u003E76,00 %\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cspan class=\"paragraph\"\u003ECe tableau r\u00e9capitule les r\u00e9sultats obtenus selon les trois niveaux d'\u00e9valuation. Nous constatons que le chunker est tr\u00e8s performant pour l'\u00e9tiquetage token par token avec un score global de +90%. Les erreurs restantes concernent les tokens int\u00e9rieurs (\u003Ccode\u003EI\u003C/code\u003E) et les chunks unitaires (\u003Ccode\u003EU\u003C/code\u003E).\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ELe F1 diminue de 1.68 point entre les niveaux 1 et 2, puis de 12.66 points entre les niveaux 2 et 3. La principale difficult\u00e9e du chunker serait de reconstruire les chunks complets, plut\u00f4t que la classification des \u00e9tiquettes.\nPour la correspondance exacte des chunks, le chunker retrouve de nombreuses unit\u00e9s, mais les erreurs de fronti\u00e8res et de cat\u00e9gories emp\u00eachent une partie des cas.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "e4347ccd0b44a28338cec1966f81e2b0", "console": [], "id": "AjVT", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"1-evaluation-des-bilou\"\u003E1. Evaluation des BILOU\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003ELe premier niveau compare, pour chaque token, l'\u00e9tiquette attribu\u00e9e par le chunker \u00e0 l'\u00e9tiquette de r\u00e9f\u00e9rence (\u003Cem\u003Egold\u003C/em\u003E). Les cinq cat\u00e9gories sont : \u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EB\u003C/strong\u003E (\u003Cem\u003EBegin\u003C/em\u003E) : premier token d'un chunk multi-token.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EI\u003C/strong\u003E (\u003Cem\u003EInside\u003C/em\u003E) : token int\u00e9rieur d'un chunk.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EL\u003C/strong\u003E (\u003Cem\u003ELast\u003C/em\u003E) : dernier token d'un chunk multi-token.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EO\u003C/strong\u003E (\u003Cem\u003EOutside\u003C/em\u003E) : token situ\u00e9 hors de tout chunk.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EU\u003C/strong\u003E (\u003Cem\u003EUnit\u003C/em\u003E) : token constituant \u00e0 lui seul un chunk.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth style=\"text-align: left;\"\u003EM\u00e9trique\u003C/th\u003E\n\u003Cth style=\"text-align: right;\"\u003EScore\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd style=\"text-align: left;\"\u003EAccuracy\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E0.9114\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd style=\"text-align: left;\"\u003EPr\u00e9cision macro\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E0.9073\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd style=\"text-align: left;\"\u003ERappel macro\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E0.9006\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd style=\"text-align: left;\"\u003EF-mesure macro\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E0.9034\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cspan class=\"paragraph\"\u003EL'accuracy signifie que 9/10 tokens re\u00e7oivent une bonne \u00e9tiquette. Le F1 donne une mesure synth\u00e9tique de la pr\u00e9cision et du rappel.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "5e4d010a0e44458fae7a2ff16441faab", "console": [], "id": "pHFh", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"les-etiquettes-bien-reconnues\"\u003ELes \u00e9tiquettes bien reconnues\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003ESelon la matrice de confusion ci-dessus, les \u00e9tiquettes \u003Ccode\u003EB\u003C/code\u003E et \u003Ccode\u003EL\u003C/code\u003E sont les mieux reconnues.\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003EB\u003C/code\u003E : 93%\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003EL\u003C/code\u003E : 91%\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003ECes chiffres montre que le chunker rep\u00e8re correctement les fronti\u00e8res d'un chunk. C'est une bonne chose puisque la suite de notre analyse repose sur cela.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EUn petit b\u00e9mole observ\u00e9 dans l'\u00e9tiquetage de \u003Ccode\u003EL\u003C/code\u003E, o\u00f9 50 tokens r\u00e9ellement \u003Ccode\u003EL\u003C/code\u003E sont pr\u00e9dit comme \u003Ccode\u003EU\u003C/code\u003E. Ce qui signifie que le chunker reconna\u00eet quelque fois une fin de segment syntaxique pour un seul chunk. De plus, une bonne reconnaissance individuelle des d\u00e9buts et des fins ne garantit pas que ces deux fronti\u00e8res appartiennent au m\u00eame chunk pr\u00e9dit.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "8be907d87bbbdc768f27217d80730ec5", "console": [], "id": "NCOB", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"la-fragilite-de-letiquette-i\"\u003ELa fragilit\u00e9 de l'\u00e9tiquette \u003Ccode\u003EI\u003C/code\u003E\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003ELe rappel de \u003Ccode\u003EI\u003C/code\u003E est de 81% contre 90% de pr\u00e9cision. Cela signifie que le mod\u00e8le retrouve la majorit\u00e9 des tokens int\u00e9rieurs, mais environ 19% des \u003Ccode\u003EI\u003C/code\u003E du gold sont manquants.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EL'unit\u00e9 interne (\u003Ccode\u003EI\u003C/code\u003E) est souvent confondu avec l'\u00e9tiquette de fin de chunk (\u003Ccode\u003EL\u003C/code\u003E), le chunker tente des fois d'\u00e9tiqueter comme fin (\u003Ccode\u003EB\u003C/code\u003E) ou encore pour chunk unitaire (\u003Ccode\u003EU\u003C/code\u003E). Cette confusion est interpr\u00e9table via le rappel de \u003Ccode\u003EI\u003C/code\u003E (81.3%), qui est nettement inf\u00e9rieur \u00e0 \u003Ccode\u003EB\u003C/code\u003E (0.93%).\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ECette erreur affecte les chunks compos\u00e9s de plus de deux tokens. Par exemple, si un token int\u00e9rieur est class\u00e9 \u003Ccode\u003EL\u003C/code\u003E, le chunk se termine trop t\u00f4t ; s'il est class\u00e9 \u003Ccode\u003EB\u003C/code\u003E, un nouveau chunk est introduit sans en \u00eatre un.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "7b4bf36177d4a71ad760402f17b2bee1", "console": [], "id": "aqbW", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"les-chunks-unitaires-u-problematiques\"\u003ELes chunks unitaires \u003Ccode\u003EU\u003C/code\u003E probl\u00e9matiques\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ccode\u003EU\u003C/code\u003E obtient un F1 de 84%, une pr\u00e9cision de 81% et un rappel de 86%.\nLe rappel est relativement sup\u00e9rieur \u00e0 la pr\u00e9cision, cela indique que le mod\u00e8le trouve une bonne partie des chunks unitaire, mais annote trop souvent \u003Ccode\u003EU\u003C/code\u003E \u00e0 des endroits o\u00f9 l'\u00e9tiquette n'est pas attendu.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EIl peut donc conduire \u00e0 fragmenter un chunk multi-token en plusieurs unit\u00e9s ou cr\u00e9er des chunks unitaires incorrects. Or selon l'analyse plus haut, l'annotation \u003Ccode\u003EU\u003C/code\u003E du chunker est fort probable de faire partie d'un token interne d'un chunk.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "ee0ce55a36ef901e32418444c83ebc91", "console": [], "id": "TRpd", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"letiquette-o\"\u003EL'\u00e9tiquette \u003Ccode\u003EO\u003C/code\u003E\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ccode\u003EO\u003C/code\u003E obtient un rappel de 100%, une pr\u00e9cision et un F1 de 99%. Le token fauss\u00e9 devrait \u00eatre une erreur d'inattention lors de l'annotation gold (manuelle), car le chunker impl\u00e9mente les \u00e9tiquettes \u003Ccode\u003EO\u003C/code\u003E en groupe en fin de traitement.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EM\u00eame si le score de cette \u00e9tiquette est excellent, cela ne signifie pas que les fronti\u00e8res sont correctement d\u00e9limit\u00e9es par \u003Ccode\u003EO\u003C/code\u003E. Au contraire, dans le corpus d'analyse, pas mal de chunk d\u00e9bordde sur le burst (segment de frappe enregistr\u00e9 entre des pauses longues) suivant. De ce fait, il n'est pas possible de dire qu'un tag \u003Ccode\u003EO\u003C/code\u003E repr\u00e9sente clairement le d\u00e9but ou la fin d'un chunk.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "1573aa13d81e632d471e2a0199cee03c", "console": [], "id": "TXez", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"selon-la-matrice-de-confusion\"\u003ESelon la matrice de confusion\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "12f7827d76e60d8a2b2473e297d4ba8c", "console": [], "id": "dNNg", "outputs": [{"data": {"application/vnd.marimo+mimebundle": "{\"image/png\": \"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABcwAAASZCAYAAADmeV3nAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAAewgAAHsIBbtB1PgABAABJREFUeJzs3Xd8FPXWx/Hvpncgjd57lyIovYmKYsECooCICthRUbhwFRQRUVEERcFKUSxXRFFEUHpv0jsJJEAICUlIbzvPHzxZE9OXTTbZfN73ta87u/ObM2ez2QTPnpwxGYZhCAAAAAAAAACACs7J3gkAAAAAAAAAAFAWUDAHAAAAAAAAAEAUzAEAAAAAAAAAkETBHAAAAAAAAAAASRTMAQAAAAAAAACQRMEcAAAAAAAAAABJFMwBAAAAAAAAAJBEwRwAAAAAAAAAAEkUzAEAAAAAAAAAkETBHAAAAAAAAAAASRTMAQAAAAAAAACQRMEcAAAAAAAAAABJFMwBAAAAAAAAAJBEwRwAAAAAAAAAAEkUzAEAAAAAAAAAkETBHAAAAAAAAAAASRTMAQAAAAAAAACQRMEcAAAAAAAAAABJFMwBAAAAAAAAAJBEwRwAAFwjk8kkk8kkDw8Pe6dSJoSGhlq+Js2aNbN3OpAUFhamF154QW3atJGfn5/l9TGZTDp58qS90ysU7zEAAACg9FAwBwAgD/Xq1ctRVDOZTDp48GCRjzebzapTp06uGOWhOAc4kh07dqhNmzaaNWuWDhw4oPj4eHunBDvJ6+d69puzs7OqVKmili1b6qGHHtKyZcuUkZFR7NiffvrpNa8rDrPZrFWrVum5555Tx44dVbNmTbm7u8vf31/NmjXToEGDNH/+fEVGRhY55ty5c63+4O/333+3HOvi4lLcpwMAAGB3FMwBACiizz77rMhr//jjD4WFhZVgNvlLSEiwFCsqV65slxyAssAwDI0YMUKxsbH2TgXlgNlsVmxsrA4fPqwlS5Zo0KBB6tChgw4dOmTv1PL122+/qW3btrrllls0e/Zs7d69W+fPn1daWppiYmJ07NgxLVu2TKNHj1aDBg303//+V4mJifZOGwAAoEyjYA4AQBEtXrxY6enpRVpbnOI6gJKxfft2HT16VJLk5uamRYsWKTIyUmazWYZhyDAMNWrUyM5Zoizbv3+/evfurbNnz9o7lRwMw9DkyZN12223FfmvnxITEzVt2jR1795d58+fL+EMAQAAyi8K5gAAFKJbt26SpKioKP3888+Frs++rnv37iWaW1mQVXhMSUmxdypADnv27LFsDxkyRA899JCCgoJkMpnsmFXx8R6zvQULFli+rlm39PR0RURE6JdfflHfvn0tay9duqQJEybYMdvcnnvuOb3xxhuW+05OTnrggQf0008/KSwsTKmpqYqKitLOnTs1depUVa1a1bJ279696tKli6KiouyROgAAQJlHwRwAgEI8/PDDcnZ2liR9/vnnha5ftGiR0tLSJEmjRo0q0dwA5C97QZBOchTGxcVFVatW1e23367Vq1dr0KBBln3Lly9XamqqHbP7x/fff68PPvjAcr9WrVravn27vv76a915552qVauW3NzcFBAQoI4dO+qVV17R8ePHNWTIEMsxZ86c0fDhw2UYhj2eAgAAQJlGwRwAgELUrFlT/fv3lyStWrVK586dK3B9VlHd399fd911V0mnByAfWR9cSZKrq6sd mportante car elle peut affecter la reconstruction des fronti\u00e8res.\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003EI\u003C/code\u003E \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\rightarrow||)\u003C/marimo-tex\u003E \u003Ccode\u003EL\u003C/code\u003E : 31 cas\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\Rightarrow||)\u003C/marimo-tex\u003E Certains tokens int\u00e9rieurs sont interpr\u00e9t\u00e9s comme des fins de chunks. Ainsi, les chunks finissent plus t\u00f4t que voulu et de nouveaux chunks s'ajoutent. Les multi-tokens sont coup\u00e9s en deux voire plus.\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003EU\u003C/code\u003E \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\rightarrow||)\u003C/marimo-tex\u003E \u003Ccode\u003EL\u003C/code\u003E : 29 cas\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003EU\u003C/code\u003E \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\rightarrow||)\u003C/marimo-tex\u003E \u003Ccode\u003EB\u003C/code\u003E : 28 cas\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\Rightarrow||)\u003C/marimo-tex\u003E Les unit\u00e9s sont parfois interpr\u00e9t\u00e9es comme des parties de chunks multi-token.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ECes confusions peuvent \u00eatre une explications plausibles de la baisse du F1 de la correspondance des chunks exacts.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "4ddf241c067980de6e8439992b22fa44", "console": [], "id": "wlCL", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"2-les-types-de-chunks\"\u003E2. Les types de chunks\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003ELe deuxi\u00e8me niveau \u00e9value les cat\u00e9gories syntaxiques, telles que : \u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003ENP (\u003Cem\u003ENoun Phrase\u003C/em\u003E)\u003C/li\u003E\n\u003Cli\u003EVP (\u003Cem\u003EVerb Phrase\u003C/em\u003E)\u003C/li\u003E\n\u003Cli\u003EPP (\u003Cem\u003EPrepositional Phrase\u003C/em\u003E)\u003C/li\u003E\n\u003Cli\u003EAP (\u003Cem\u003EAdjective Phrase\u003C/em\u003E)\u003C/li\u003E\n\u003Cli\u003EADVP (\u003Cem\u003EAdverb Phrase\u003C/em\u003E)\u003C/li\u003E\n\u003Cli\u003ECONJ (\u003Cem\u003EConjunction\u003C/em\u003E)\u003C/li\u003E\n\u003Cli\u003EUNKNOWN le \"fourre-tout\"\u003C/li\u003E\n\u003Cli\u003E\u0026lt;PAUSE\u0026gt;, \u0026lt;SUPPR\u0026gt;, \u0026lt;SPACE\u0026gt; les cat\u00e9gories sp\u00e9ciaux\u003C/li\u003E\n\u003C/ul\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth style=\"text-align: left;\"\u003EM\u00e9trique\u003C/th\u003E\n\u003Cth style=\"text-align: right;\"\u003EScore\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd style=\"text-align: left;\"\u003EAccuracy\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E0.8967\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd style=\"text-align: left;\"\u003EPr\u00e9cision macro\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E0.8850\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd style=\"text-align: left;\"\u003ERappel macro\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E0.8924\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd style=\"text-align: left;\"\u003EF-mesure macro\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E0.8866\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cspan class=\"paragraph\"\u003ELe chunker reconna\u00eet correctement une grande partie des types de chunks. La diff\u00e9rence de 1.68 poibt de F1 avec le niveau BILOU est relativement limit\u00e9e. N\u00e9anmoins, certaines classes sont plus difficiles que d'autres.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "b7d31d4ef29532a33b7527530f528415", "console": [], "id": "kqZH", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"les-categories-les-mieux-reconnues\"\u003ELes cat\u00e9gories les mieux reconnues\u003C/h3\u003E\n\u003Ch4 id=\"pause-suppr-et-space\"\u003E\u0026lt;PAUSE\u0026gt;, \u0026lt;SUPPR\u0026gt; et \u0026lt;SPACE\u0026gt;\u003C/h4\u003E\n\u003Cspan class=\"paragraph\"\u003ELes cat\u00e9gories techniques \u0026lt;PAUSE\u0026gt;, \u0026lt;SPACE\u0026gt; et \u0026lt;SUPPR\u0026gt; sont parfaitement reconnues. Cela s'explique par le copier-coller de ces donn\u00e9es du corpus annot\u00e9 par le chunker au corpus annot\u00e9 manuellement. Ces \u00e9tiquettes sont plus significative sur d'autres sujets d'analyse que celui qui nous int\u00e9resse maintenant. De plus, l'automatisme impl\u00e9ment\u00e9 dans le chunker permettait de choisir correctement entre ces trois \u00e9tiquettes selon la colonnes \u003Ccode\u003EcharBurst\u003C/code\u003E et \u003Ccode\u003Eburst\u003C/code\u003E du corpus d'origine.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EC'\u00e9tait aussi un moyen d'avoir le moins de cellule vide et sans signification dans notre corpus apr\u00e8s traitement.\u003C/span\u003E\n\u003Ch4 id=\"vp-groupes-verbaux\"\u003EVP -- groupes verbaux\u003C/h4\u003E\n\u003Cspan class=\"paragraph\"\u003EF1 = 94%\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EC'est la meilleure performance parmi les principales cat\u00e9gories syntaxiques. La pr\u00e9cision de 94% et le rappel de 95% montrent que le mod\u00e8le reconna\u00eet bien les VP pr\u00e9sents dans le corpus et produit relativement peu de VP erron\u00e9s.\u003C/span\u003E\n\u003Ch4 id=\"pp-groupe-prepositionnels\"\u003EPP -- groupe pr\u00e9positionnels\u003C/h4\u003E\n\u003Cspan class=\"paragraph\"\u003EF1 = 89%\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EC'est la cat\u00e9gorie la plus importante parmi les autres groupes syntaxiques (843 occurrences). Une pr\u00e9cision de 91% et le rappel de 87% montrent que les PP sont globalement bien reconnus, mais qu'une partie des PP du gold ne sont pas trouv\u00e9e.\u003C/span\u003E\n\u003Ch4 id=\"np-groupes-nominaux\"\u003ENP -- groupes nominaux\u003C/h4\u003E\n\u003Cspan class=\"paragraph\"\u003EF1 = 84%\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ELe rappel (87%) est sup\u00e9rieur \u00e0 la pr\u00e9cision (80%). Le chunker retrouve une grande partie des NP mais sur-annote des NP. Cette diff\u00e9rence peut \u00eatre traduit par des confusions entre groupes nominaux et d'autres cat\u00e9gories syntaxiques, des fronti\u00e8res incorrectes ou encore simplement une mauvaise \u00e9tiquetage du POSTagger.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ECette partie sera d\u00e9taill\u00e9 avec la matrice de confusion plus loin.\u003C/span\u003E\n\u003Ch4 id=\"conj-conjonctions\"\u003ECONJ -- conjonctions\u003C/h4\u003E\n\u003Cspan class=\"paragraph\"\u003EF1 : 84%\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ELa pr\u00e9cision atteint 95% mais le rappel assez bas en comparaison (75%). Le mod\u00e8le est assez fiable pour annot\u00e9 les CONJ, mais il manque environ un quart des occurrences gold. Ce manque s'explique par un nombre de locutions conjonctives non int\u00e9gr\u00e9es dans la ressource du chunker. Celles-ci ont \u00e9t\u00e9 rep\u00e9r\u00e9 lors de l'annotation manuelle et non lors de la construction du chunker.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "d929d64f25a5c58d3ad0983695eacf94", "console": [], "id": "wAgl", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"les-categories-plus-difficiles\"\u003ELes cat\u00e9gories plus difficiles\u003C/h3\u003E\n\u003Ch4 id=\"ap-groupes-adjectivaux\"\u003EAP -- groupes adjectivaux\u003C/h4\u003E\n\u003Cspan class=\"paragraph\"\u003EF1 = 64%\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EC'est la cat\u00e9gorie syntaxique la plus difficile parmi les classes principales. Sa pr\u00e9cision de 0.57 signifie que 43% des annotations du chunker sont erron\u00e9es. Son rappel de 0.74 indique que le mod\u00e8le retrouve environ les trois quarts des AP du gold.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ECette cat\u00e9gorie ne compte que 38 occurrences gold. Son faible support rend l'estimation plus sensible \u00e0 quelques erreurs suppl\u00e9mentaires. De plus, pendant l'annotation manuelle, certains AP peuvent \u00eatre absorb\u00e9 dans d'autres groupes syntaxiques, \u00e0 la diff\u00e9rence du chunker qui suit les r\u00e8gles \u00e0 la lettre.\u003C/span\u003E\n\u003Ch4 id=\"unknown\"\u003EUNKNOWN\u003C/h4\u003E\n\u003Cspan class=\"paragraph\"\u003EF1 = 70%\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ELa pr\u00e9cision (0.69) et le rappel (0.70) sont mod\u00e9r\u00e9s. Cette classe regroupe des cas h\u00e9t\u00e9rog\u00e8nes. Selon l'annotation du POSTagger et l'interpr\u00e9tation de l'humain, cette classe peut beaucoup diff\u00e9rer. Comme il regroupe tout ce dont il semble impossible de cat\u00e9goriser, il est fort probable que le taux de \u003Ccode\u003EUNKNOWN\u003C/code\u003E du gold est plus importante qu'au chunker.\u003C/span\u003E\n\u003Ch4 id=\"advp-groupes-adverbiaux\"\u003EADVP -- groupes adverbiaux\u003C/h4\u003E\n\u003Cspan class=\"paragraph\"\u003EF1 = 80%\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ELe rappel (0.84) d\u00e9passe la pr\u00e9cision (0.76). C'est-\u00e0-dire que le chunker retrouve relativement bien les \u003Ccode\u003EADVP\u003C/code\u003E mais qu'il en sur-annote un grand nombre de cas.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "1573aa13d81e632d471e2a0199cee03c", "console": [], "id": "rEll", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"selon-la-matrice-de-confusion\"\u003ESelon la matrice de confusion\u003C/h3\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "8dbe82b1a754d64f767f070d820ba79e", "console": [], "id": "dGlV", "outputs": [{"data": {"application/vnd.marimo+mimebundle": "{\"image/png\": \"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABdwAAASdCAYAAABaRp4ZAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAAewgAAHsIBbtB1PgABAABJREFUeJzs3XdYU9cbB/Bv2FumoKCo4AT33nvvUbd1rzqrVjvdWmtbrVrrz7r3qHvvUffeIk5QlCmyN7m/PwLXREhywUCAfj/Pw/OE3HNPTm5OTpL3nvsemSAIAoiIiIiIiIiIiIiI6LMY6LsBREREREREREREREQFAQPuREREREREREREREQ6wIA7EREREREREREREZEOMOBORERERERERERERKQDDLgTEREREREREREREekAA+5ERERERERERERERDrAgDsRERERERERERERkQ4w4E5EREREREREREREpAMMuBMRERERERERERER6QAD7kREREREREREREREOsCAOxERERERERERERGRDjDgTkRERERERERERESkAwy4ExERERERERERERHpAAPuREREREREREREREQ6wIA7EREREREREREREZEOMOBORERERERERERERKQDDLgTEREREREREREREekAA+5ERERERERERERERDrAgDsRERERERERERERkQ4w4E5ERER65enpCZlMBplMhoCAAH03J08wMjKCTCaDkZGRvptCAMLDwzFz5kzUqlULtra2MDAwEPvssWPH9N08rfgeI9LuyZMn4vvE29tb383JVf/l505ERJQTGHAnIiLKAS1atBB/vKb/7du3L0t1NGrUKEMd+SG4R1SQ+Pv7o0qVKpg1axZu3LiByMhICIKg72ZRLoiIiMgwBn/uH8dwIiIiooKPAXciIqJcsmbNGsllnz17hgsXLuRgazRzcXERA0RhYWF6aweRvn311Vd48+aNvptBRERERET5BAPuREREueTo0aMIDAyUVHbt2rU53Boi0iYkJARHjx4V///111/x7t07pKamQhAECIKANm3a6LGFRERERESU1zDgTkRElMMaNGgAAEhNTcXGjRu1lk9NTcWGDRsAAKVKlULRokVztH369vz5czF46ebmpu/mEInu3r0rpo+pV68epkyZgiJFisDAIH99heZ7LHtsbW3F46bub9q0aWL5xo0bay3PEzREREREBV/++rVARESUD3Xp0gX29vYAgHXr1mktf+TIEXEm/JAhQyCTyXK0fUSUOeV0Sp6ennpsCRERERER5RcMuBMREeUwU1NT9OvXDwDg6+uLixcvaiyfnk7GwMAAAwcOzPH2EVHmkpKSxNvGxsZ6bAkREREREeUXDLgTERHlgqFDh4q3NeVnDw4OxqFDhwAArVu3lpz+ITo6GidOnMBPP/2Eli1bwsvLC4ULF4aJiQkcHR1RtWpVjB8/Hvfv31dbR1hYmLhQanBwsHi/k5OTeL/y3927d1X2NzMzE7elpKQAAC5cuIDhw4ejbNmyKFSoEGQyGcaOHauyn6enp7hfQECA1uf69u1bzJs3D82bN4ebmxvMzc1hY2ODMmXKoHnz5pg3bx7u3buntR5/f3/MmjULDRs2RNGiRWFqago7OztUrFgR48aN03issis+Ph6LFy9G/fr14ejoCHNzc5QsWRK9evXCsWPHsl2vPp4LoLvX4tChQxg0aBDKlCkDGxsbmJubo3jx4ujYsSNWrlyJxMRErXVk1v9u3L tputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ELes principales confusions observ\u00e9es dans la matrice ci-dessus :\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003EPP\u003C/code\u003E \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\rightarrow||)\u003C/marimo-tex\u003E \u003Ccode\u003ENP\u003C/code\u003E : 85 cas.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\Rightarrow||)\u003C/marimo-tex\u003E C'est une confusion importante entre deux cat\u00e9gories syntaxiques fr\u00e9quentes. Elle peut provenir d'une diff\u00e9rence de typage, d'une erreur de combinaison ou d'une combinaison des deux cas.\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003ENP\u003C/code\u003E \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\rightarrow||)\u003C/marimo-tex\u003E \u003Ccode\u003EPP\u003C/code\u003E : 42 cas.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\Rightarrow||)\u003C/marimo-tex\u003E La confusion fonctionne dans les deux sens, m\u00eames si les effectifs sont diff\u00e9rents.\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003EADVP\u003C/code\u003E \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\rightarrow||)\u003C/marimo-tex\u003E \u003Ccode\u003EAP\u003C/code\u003E : 4 cas.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003EAP\u003C/code\u003E \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\rightarrow||)\u003C/marimo-tex\u003E \u003Ccode\u003EADVP\u003C/code\u003E : 2 cas.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\Rightarrow||)\u003C/marimo-tex\u003E Ces confusions existent, mais ne suffisent pas \u00e0 expliquer \u00e0 elles seules le faible F1 de AP.\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003ECONJ\u003C/code\u003E \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\rightarrow||)\u003C/marimo-tex\u003E \u003Ccode\u003EADVP\u003C/code\u003E : 12 cas.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\Rightarrow||)\u003C/marimo-tex\u003E Ce type d'erreur contribue \u00e0 la perte de rappel de \u003Ccode\u003ECONJ\u003C/code\u003E.\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003EUNKNOWN\u003C/code\u003E \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\rightarrow||)\u003C/marimo-tex\u003E \u003Ccode\u003ENP\u003C/code\u003E : 9 cas.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003EUNKNOWN\u003C/code\u003E \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\rightarrow||)\u003C/marimo-tex\u003E \u003Ccode\u003EPP\u003C/code\u003E : 7 cas.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\Rightarrow||)\u003C/marimo-tex\u003E La classe \u003Ccode\u003EUNKNWON\u003C/code\u003E se confond avec des cat\u00e9gories syntaxiques plus courantes. Cela peut \u00eatre du \u00e0 un mauvais d\u00e9coupage des chunks.\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003EVP\u003C/code\u003E \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\rightarrow||)\u003C/marimo-tex\u003E \u003Ccode\u003ENP\u003C/code\u003E : 4 cas.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003EVP\u003C/code\u003E \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\rightarrow||)\u003C/marimo-tex\u003E \u003Ccode\u003EPP\u003C/code\u003E : 8 cas\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\Rightarrow||)\u003C/marimo-tex\u003E Les erreurs de typage des \u003Ccode\u003EVP\u003C/code\u003E restent limit\u00e9es relativement \u00e0 leur support.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ELa confusion NP-PP peut \u00eatre du \u00e0 la diff\u00e9rence d'interpr\u00e9tation de certains ADP, qui selon le contexte peut \u00eatre d\u00e9terminant ou pr\u00e9position. Le r\u00f4le du POSTagger est important dans cette partie.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "6b6215bae8fc5962641e0ed1a5f06a49", "console": [], "id": "lgWD", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ELe faible support de NUM a permit un score parfait. Dans l'\u00e9chantillon choisi, cette cat\u00e9gories \u00e9tait tr\u00e8s peu pr\u00e9sente (seulement 1 occurrence).\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EPour conclure, le mod\u00e8le reconna\u00eet bien les cat\u00e9gories syntaxiques fr\u00e9quentes, en particulier VP et PP. Ses principales difficult\u00e9s concernent AP, UNKNOWN et certaines confusions entre NP et PP. Ces erreurs peuvent contribuer \u00e0 la d\u00e9gradation des chunks exacts, mais leurs effets pr\u00e9cis ne peuvent pas \u00eatre d\u00e9duits des seules matrices de confusion.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "20e379a2107d18b6d5d2d4f1fd07a1eb", "console": [], "id": "yOPj", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"3-les-chunks-exacts\"\u003E3. Les chunks exacts\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cmarimo-ui-element object-id='yOPj-0' random-id='be6ac87f-3247-076e-6203-de787dd6d8c4'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;_marimo_row_id\u0026#92;\u0026quot;:0,\u0026#92;\u0026quot;Mesure\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Vrais positifs (TP)\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Nombre\u0026#92;\u0026quot;:1082},{\u0026#92;\u0026quot;_marimo_row_id\u0026#92;\u0026quot;:1,\u0026#92;\u0026quot;Mesure\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Faux positifs (FP)\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Nombre\u0026#92;\u0026quot;:3 s\u0026quot;:{\u0026quot;arrowcolor\u0026quot;:\u0026quot;#2a3f5f\u0026quot;,\u0026quot;arrowhead\u0026quot;:0,\u0026quot;arrowwidth\u0026quot;:1},\u0026quot;geo\u0026quot;:{\u0026quot;bgcolor\u0026quot;:\u0026quot;white\u0026quot;,\u0026quot;landcolor\u0026quot;:\u0026quot;#E5ECF6\u0026quot;,\u0026quot;subunitcolor\u0026quot;:\u0026quot;white\u0026quot;,\u0026quot;showland\u0026quot;:true,\u0026quot;showlakes\u0026quot;:true,\u0026quot;lakecolor\u0026quot;:\u0026quot;white\u0026quot;},\u0026quot;title\u0026quot;:{\u0026quot;x\u0026quot;:0.05}}},\u0026quot;xaxis\u0026quot;:{\u0026quot;anchor\u0026quot;:\u0026quot;y\u0026quot;,\u0026quot;domain\u0026quot;:[0.0,1.0],\u0026quot;title\u0026quot;:{\u0026quot;text\u0026quot;:\u0026quot;\u0026quot;}},\u0026quot;yaxis\u0026quot;:{\u0026quot;anchor\u0026quot;:\u0026quot;x\u0026quot;,\u0026quot;domain\u0026quot;:[0.0,1.0],\u0026quot;title\u0026quot;:{\u0026quot;text\u0026quot;:\u0026quot;Nombre de chunks\u0026quot;},\u0026quot;rangemode\u0026quot;:\u0026quot;tozero\u0026quot;},\u0026quot;legend\u0026quot;:{\u0026quot;tracegroupgap\u0026quot;:0},\u0026quot;title\u0026quot;:{\u0026quot;text\u0026quot;:\u0026quot;\u00c9valuation des chunks exacts\u0026quot;},\u0026quot;barmode\u0026quot;:\u0026quot;relative\u0026quot;,\u0026quot;showlegend\u0026quot;:false,\u0026quot;dragmode\u0026quot;:\u0026quot;zoom\u0026quot;}}' data-config='{}'\u003E\u003C/marimo-plotly\u003E\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "39ac57c43a22952a67f700a039912824", "console": [], "id": "fwwy", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"les-vraies-positifs\"\u003ELes vraies positifs\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003ELes 1082 TP correspondent aux chunks pr\u00e9dits qui satisfont exactement le crit\u00e8re de correspondance avec le chunk gold.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EPour qu'un chunk soit consid\u00e9r\u00e9 comme exact, il faut normalement que les conditions d\u00e9finies par le protocole soient toutes satisfaites :\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003Em\u00eame token de d\u00e9but\u003C/li\u003E\n\u003Cli\u003Em\u00eame token de fin\u003C/li\u003E\n\u003Cli\u003Em\u00eame type syntaxique\u003C/li\u003E\n\u003Cli\u003Em\u00eame unit\u00e9 d'\u00e9valuation, notamment concernant les fronti\u00e8res entre bursts.\u003C/li\u003E\n\u003C/ol\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "9b149df51d04919c00061e93d77cd030", "console": [], "id": "LJZf", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"les-faux-positifs\"\u003ELes faux positifs\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003ELes 362 FP correpondent \u00e0 des chunks pr\u00e9dits qui ne trouvent pas de correspondance exacte dans la r\u00e9f\u00e9rence.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EPlusieurs situations peuvent produire des FP :\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003Eun chunk est cr\u00e9\u00e9 alors qu'aucun chunk gold ne correspond \u00e0 cette portion\u003C/li\u003E\n\u003Cli\u003Eles fronti\u00e8res du chunk pr\u00e9dit sont trop courtes ou trop longues\u003C/li\u003E\n\u003Cli\u003Ele type syntaxique est incorrect\u003C/li\u003E\n\u003Cli\u003Eun chunk est fragment\u00e9 en plusieurs chunks pr\u00e9dits\u003C/li\u003E\n\u003Cli\u003Eune r\u00e8gle d'alignement entre bursts ne permet pas d'apparier la pr\u00e9diction et la r\u00e9f\u00e9rence\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003ECe nombre de FP signifie que le mod\u00e8le produit des chunks non valid\u00e9s par le gold que ne laisserait penser sa seule accuracy token par token (niveau 1)\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "05733257894e1d0f74a82a82864383c4", "console": [], "id": "urSm", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"les-faux-negatifs\"\u003ELes faux n\u00e9gatifs\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003ELes 322 FN repr\u00e9sentent des chunks gold qui n'ont pas \u00e9t\u00e9 retrouv\u00e9s.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EUn chunk peut \u00eatre compt\u00e9 comme FN m\u00eame si une grande partie de ses tokens est correctement pr\u00e9dite. Par exemple un groupe nominal peut \u00eatre bien identifi\u00e9 dans son contenu, mais ne pas \u00eatre reconnu comme un seul chunk parce que son dernier token est mal \u00e9tiquet\u00e9.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EIl est important de noter qu'une seule erreur de segmentation peut engendrer simultan\u00e9ment plusieurs cons\u00e9quences. Par exemple, un chunk gold peut \u00eatre manqu\u00e9 et plusieurs chunks pr\u00e9dits \u00e0 sa place peuvent \u00eatre incorrects. Les 362 FP et 322 FN ne correspondent donc pas n\u00e9cessairement \u00e0 684 erreurs ind\u00e9pendantes.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EDe plus, avant de proc\u00e9der \u00e0 l'\u00e9valuation, nous avons d\u00e9cid\u00e9 de diviser le corpus gold en 30-70 pour pouvoir garder un \u00e9chantillon si des modifications seront apport\u00e9es aux r\u00e8gles syntaxiques en vu de r\u00e9sultats catastrophiques de la premi\u00e8re \u00e9valuation. Cette division s'est fait un peu al\u00e9atoire dans le corpus gold. Pour avoir un bout d'\u00e9chantillon de toutes les th\u00e9matiques abord\u00e9es (m\u00e9decine, alcool, transport en commun...) et une extraction \u00e9quitable de toutes les \u003Ccode\u003EID\u003C/code\u003E (F+/F-, P+/P-, R+/R-). Il soit possible que des chunks du corpus annot\u00e9 par le chunker soit coup\u00e9 en deux, puisque la s\u00e9paration s'est bas\u00e9e sur le corpus gold.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "10ac2bb5be0f9bba424986439ef98874", "console": [], "id": "jxvo", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"une-precision-legerement-inferieur-au-rappel\"\u003EUne pr\u00e9cision l\u00e9g\u00e8rement inf\u00e9rieur au rappel\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cmarimo-ui-element object-id='jxvo-0' random-id='cfac2a50-3e22-28dc-dfdc-494441be3491'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;_marimo_row_id\u0026#92;\u0026quot;:0,\u0026#92;\u0026quot;M\u0026#92;\u0026#92;u00e9trique\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Pr\u0026#92;\u0026#92;u00e9cision\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Valeur\u0026#92;\u0026quot;:0.7493074792243767},{\u0026#92;\u0026quot;_marimo_row_id\u0026#92;\u0026quot;:1,\u0026#92;\u0026quot;M\u0026#92;\u0026#92;u00e9trique\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Rappel\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Valeur\u0026#92;\u0026quot;:0.7706552706552706},{\u0026#92;\u0026quot;_marimo_row_id\u0026#92;\u0026quot;:2,\u0026#92;\u0026quot;M\u0026#92;\u0026#92;u00e9trique\u0026#92;\u0026quot;:\u0026#92;\u0026quot;F1-score\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Valeur\u0026#92;\u0026quot;:0.7598314606741573}]\u0026quot;' data-total-rows='3' data-total-columns='2' data-max-columns='50' data-banner-text='\u0026quot;\u0026quot;' data-pagination='false' data-page-size='10' data-field-types='[[\u0026quot;M\u00e9trique\u0026quot;,[\u0026quot;string\u0026quot;,\u0026quot;str\u0026quot;]],[\u0026quot;Valeur\u0026quot;,[\u0026quot;number\u0026quot;,\u0026quot;float64\u0026quot;]]]' data-selection='\u0026quot;multi\u0026quot;' data-show-filters='true' data-show-download='true' data-show-search='true' data-show-column-summaries='false' data-show-data-types='true' data-show-page-size-selector='false' data-show-column-explorer='true' data-show-chart-builder='true' data-row-headers='[]' data-hidden-columns='[]' data-has-stable-row-id='true' data-lazy='false' data-preload='false'\u003E\u003C/marimo-table\u003E\u003C/marimo-ui-element\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ELa pr\u00e9cision est de 74,9%, tandis que le rappel atteint 77,1%. L'\u00e9cart est de 2.2 points.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ELe mod\u00e8le retrouve donc une proportion l\u00e9g\u00e8rement plus importante des chunks gold qu'il ne produit de chunks valid\u00e9s. Il existe un d\u00e9s\u00e9quilibre mod\u00e9r\u00e9 en faveur du rappel : les pr\u00e9dictions non valid\u00e9es sont un peu plus nombreuses que les chunks gold manqu\u00e9s.\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E1444 chunks ont \u00e9t\u00e9 pr\u00e9dits, soit 1082+362 (FP)\u003C/li\u003E\n\u003Cli\u003E1404 chunks gold sont \u00e0 retrouver, soit 1082+322 (FN)\u003C/li\u003E\n\u003Cli\u003E1082 correspondent exactement\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003ESur la base de ces comptes, environ 25,1% des chunks pr\u00e9dits ne sont pas des correspondances exactes, et environ 22,9% des chunks gold ne sont pas retrouv\u00e9s exactement.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ECes chiffres ne signifient pas n\u00e9cessairement que 25,1% des groupes syntaxiques sont totalement d\u00e9pourvus d'information correcte : certains peuvent pr\u00e9senter un contenu largement juste, mais des fronti\u00e8res ou un type erron\u00e9s.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "f598a41bea8efa5b0d93fdcd38c9fd8d", "console": [], "id": "mWxS", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"limites-et-conclusion\"\u003ELimites et conclusion\u003C/h2\u003E\n\u003Ch3 id=\"limites\"\u003ELimites\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EComme nous avons pu l'observer lors de l'analyse, le score d'accuracy du niveau 1 (BILOU) est tr\u00e8s \u00e9lev\u00e9, cependant, ce score peut \u00eatre influenc\u00e9e par la distribution des classes. L'\u00e9tiquette \u003Ccode\u003EO\u003C/code\u003E atteint un F1 de 0.99, ce qui contribue favorablement au score global.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EDe plus, en raison d'une extraction al\u00e9atoire du corpus gold, le support des classes est in\u00e9gal. Les cat\u00e9gories fr\u00e9quentes comme \u003Ccode\u003EPP\u003C/code\u003E et \u003Ccode\u003ENP\u003C/code\u003E p\u00e8sent beaucoup plus dans les performances globales que \u003Ccode\u003ENUM\u003C/code\u003E ou \u003Ccode\u003ESPACE\u003C/code\u003E. Les scores parfaits de certaines classes rares ne doivent pas \u00eatre interpr\u00e9t\u00e9s comme une garantie de g\u00e9n\u00e9ralisation. Mais aussi, le score faible de classe ambigu\u00eb est tout \u00e0 fait explicable et raisonable. La compr\u00e9hension du texte par l'humain est tr\u00e8s divers compar\u00e9 aux chunker qui suit des r\u00e8gles quelque fois incompl\u00e8te.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EEnfin, l'\u00e9valuation du niveau 3 est tr\u00e8s sensible \u00e0 la moindre erreur. Ce qui explique son taux plus faible que les deux autres niveaux.\u003C/span\u003E\n\u003Ch3 id=\"conclusion\"\u003EConclusion\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003ELes r\u00e9sultats montrent que le chunker reconna\u00eet correctement la majorit\u00e9 des \u00e9tiquettes BILOU et les cat\u00e9gories syntaxiques, avec des performances globales proches de 90% sur les deux premiers niveaux. Les cat\u00e9gories \u003Ccode\u003EVP\u003C/code\u003E et \u003Ccode\u003EPP\u003C/code\u003E sont particuli\u00e8rement bien reconnues, tandis que les \u00e9tiquettes \u003Ccode\u003EI\u003C/code\u003E et \u003Ccode\u003EU\u003C/code\u003E, les groupes \u003Ccode\u003EAP\u003C/code\u003E et l'\u00e9tiquette \u003Ccode\u003EUNKNOWN\u003C/code\u003E pr\u00e9sentent davantage de difficult\u00e9s.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EEn revanche, le F1 exact de 76% r\u00e9v\u00e8le une diff\u00e9rence notable entre la reconnaissance des \u00e9l\u00e9ments locaux et la reconstruction des chunks complets. Ce r\u00e9sultat indique que la qualit\u00e9 finale de la segmentation reste inf\u00e9rieure \u00e0 ce que sugg\u00e8rent les scores token par token et par type.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EL'hypoth\u00e8se prioritaire est celle des erreurs de fronti\u00e8res, notamment lorsque les chunks traversent plusieurs bursts. Les confusions BILOU observ\u00e9es et les difficult\u00e9s de classification de certaines cat\u00e9gories peuvent \u00e9galement contribuer \u00e0 cet \u00e9cart. Mais aussi, il soit possible que la division de l'\u00e9chantillon gold a empir\u00e9 le corpus d'\u00e9valuation. Cependant, les r\u00e9sultats actuels ne permettent pas d'attribuer une proportion pr\u00e9cise \u00e0 la baisse \u00e0 chacun de ces facteurs.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}], "metadata": {"marimo_version": "0.25.1", "script_metadata_hash": null}, "version": "1"},
            "runtimeConfig": null
        }),
        writable: false,
        configurable: false,
      });
    </script>
